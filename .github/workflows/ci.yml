name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Node regressions (synthetic accounts)
        run: node --test test/*.test.mjs
      - name: Publication file checks
        run: node tools/release-check.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.node == 24
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install synthetic database test dependencies
        if: matrix.node == 24
        run: python -m pip install pycryptodome==3.23.0 zstandard==0.25.0 pywin32==312 pywinauto==0.6.9 comtypes==1.4.17 six==1.17.0 Pillow==12.0.0
      - name: Synthetic database and window detection checks
        if: matrix.node == 24
        run: |
          python tools/check-wechat-database.py
          python tools/check-wechat-detection.py
          python tools/check-client-compatibility.py
